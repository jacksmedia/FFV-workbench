<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPC-700 Cross-Game Transpiler</title>
  <meta name="description" content="Transpile SNES music between FF4, FF5, FF6, and FFMQ">
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --text-primary: #eaeaea;
      --text-secondary: #a0a0a0;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --success: #4ecca3;
      --warning: #ffc107;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    #app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--bg-secondary);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-secondary);
    }

    .game-badges {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-ff4 { background: #2d5a27; }
    .badge-ff5 { background: #1e3a5f; }
    .badge-ff6 { background: #5a2750; }
    .badge-ffmq { background: #5a4a27; }

    .drop-zone {
      border: 2px dashed var(--text-secondary);
      border-radius: 12px;
      padding: 3rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-secondary);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(233, 69, 96, 0.1);
    }

    .drop-zone input[type="file"] {
      display: none;
    }

    .status {
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 8px;
      display: none;
    }

    .status.visible {
      display: block;
    }

    .status.success { background: rgba(78, 204, 163, 0.2); }
    .status.error { background: rgba(233, 69, 96, 0.2); }

    .result-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-top: 1rem;
    }

    .result-card h4 {
      margin-bottom: 0.25rem;
    }

    .result-meta {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    .byte-breakdown {
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .size-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.4rem 0;
      font-size: 0.85rem;
    }

    .size-row label {
      color: var(--text-secondary);
      min-width: 8.5rem;
    }

    .size-bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .size-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }

    .fit-ok { background: var(--success); }
    .fit-tight { background: var(--warning); }
    .fit-over { background: var(--accent); }

    .size-caption {
      min-width: 16rem;
      font-family: Consolas, monospace;
      font-size: 0.8rem;
    }

    .card-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin: 0.75rem 0;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-small:hover { border-color: var(--accent); }

    .slot-select {
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--text-secondary);
      font-size: 0.8rem;
      max-width: 20rem;
    }

    .hex-dump {
      font-family: Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      max-height: 260px;
      overflow: auto;
      background: #0d0d1a;
      padding: 0.75rem;
      border-radius: 6px;
      white-space: pre;
      color: var(--text-secondary);
    }

    details summary {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-Cmg0qynh.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>SPC-700 Cross-Game Transpiler</h1>
      <p class="subtitle">Transpile SNES music between Final Fantasy games</p>
      <div class="game-badges">
        <span class="badge badge-ff4">FF4</span>
        <span class="badge badge-ff5">FF5</span>
        <span class="badge badge-ff6">FF6</span>
        <span class="badge badge-ffmq">FFMQ</span>
      </div>
    </header>

    <main>
      <div class="drop-zone" id="dropZone">
        <p>Drop a ROM file here or click to select</p>
        <p class="subtitle" style="margin-top: 0.5rem; font-size: 0.875rem;">
          Supports .sfc, .smc files (FF4, FF5, FF6, FFMQ)
        </p>
        <input type="file" id="romInput" accept=".sfc,.smc,.fig">
      </div>

      <div class="status" id="status"></div>

      <div class="workspace" id="workspace" style="display: none; margin-top: 2rem;">
        <div class="panel" style="background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem;">
          <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Track List</h2>
          <div id="trackList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>

        <div class="transpile-controls" style="margin-top: 1.5rem; display: flex; gap: 1rem; align-items: center;">
          <label style="color: var(--text-secondary);">Target Game:</label>
          <select id="targetGame" style="padding: 0.5rem 1rem; border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--text-secondary);">
            <option value="ff4">Final Fantasy IV</option>
            <option value="ff5">Final Fantasy V</option>
            <option value="ff6" selected>Final Fantasy VI</option>
            <option value="ffmq">Final Fantasy: Mystic Quest</option>
          </select>
          <button id="transpileBtn" style="padding: 0.75rem 1.5rem; border-radius: 8px; background: var(--accent); color: white; border: none; cursor: pointer; font-weight: 600;">
            Transpile Selected
          </button>
        </div>

        <div id="outputPanel" style="display: none; margin-top: 1.5rem; background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem;">
          <h3 style="margin-bottom: 1rem;">Transpilation Result</h3>
          <pre id="outputLog" style="font-family: monospace; font-size: 0.875rem; white-space: pre-wrap; color: var(--text-secondary);"></pre>
          <div id="resultsContainer"></div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
