<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FF1 three.js proof of concept — Phases A–F</title>
<style>
  body { margin:0; background:#000; overflow:hidden; font-family:monospace; }
  #hud { position:fixed; top:8px; left:8px; color:#fff; background:rgba(0,0,32,.7);
         padding:6px 10px; border:2px solid #fff; white-space:pre; }
  #battle { display:none; position:fixed; inset:20% 25%; background:#001;
            border:4px double #fff; color:#fff; padding:24px; }
  #battle button { font-family:monospace; margin-right:12px; }
  #shop, #inv { display:none; position:fixed; inset:15% 25%; background:#001;
          border:4px double #fff; color:#fff; padding:24px; overflow-y:auto; }
  #shop button, #inv button { font-family:monospace; display:block; margin:6px 0; }
  #battle { overflow-y:auto; }
  #battle button { margin-top:8px; }
  #dialog { display:none; position:fixed; left:12%; right:12%; top:8%;
            background:#001; border:4px double #fff; color:#fff;
            padding:16px 20px; font-family:monospace; white-space:pre-line; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- generated by tools/ff1/extract_ff1_assets.py; demo falls back to placeholder without it -->
<script src="ff1_assets.js"></script>
</head>
<body>
<div id="hud"></div>
<div id="battle"></div>
<div id="shop"></div>
<div id="inv"></div>
<div id="dialog"></div>
<script>
"use strict";
const TILE = 16, WORLD_W = 256, MAP_W = 64;
const hasAssets = typeof FF1_ASSETS !== "undefined";

function b64bytes(s){ const b = atob(s), a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function b64img(s, cb){ const i = new Image(); i.onload = () => cb(i);
  i.src = "data:image/png;base64," + s; }

// ---------------- data layer ----------------
let world, monsters, heroImg, worldSheet;

if (hasAssets) {
  world = { map: b64bytes(FF1_ASSETS.mapB64), props: FF1_ASSETS.tileProps,
            entrances: FF1_ASSETS.worldEntrances };
  monsters = FF1_ASSETS.monsters;
} else {
  // placeholder island (world only — Phase A interiors need real assets)
  const map = new Uint8Array(WORLD_W * WORLD_W);
  const g = []; for (let i = 0; i < 18*18; i++) g.push(Math.random());
  const n = (x,y) => { const gx=x/WORLD_W*16, gy=y/WORLD_W*16, x0=gx|0, y0=gy|0,
    fx=gx-x0, fy=gy-y0, s=i=>g[(y0+(i>>1))*18+x0+(i&1)],
    L=(a,b,t)=>a+(b-a)*(t*t*(3-2*t));
    return L(L(s(0),s(1),fx), L(s(2),s(3),fx), fy); };
  for (let y = 0; y < WORLD_W; y++) for (let x = 0; x < WORLD_W; x++) {
    const dx=x/WORLD_W-.5, dy=y/WORLD_W-.5, v=n(x,y)-(dx*dx+dy*dy)*2.2;
    map[y*WORLD_W+x] = v<.18?0 : v<.24?1 : v<.45?2 : v<.58?3 : 4;
  }
  world = { map, entrances: [],
    props: [{impassable:1,ship:1,canoe:1},{impassable:0,dock:1,land:1},
            {impassable:0,battle:1,land:1},{impassable:0,battle:1},
            {impassable:1}] };
  monsters = [{name:"IMP",hp:8,attack:4,gp:6,exp:6},
              {name:"WOLF",hp:20,attack:10,gp:22,exp:24}];
}

// ---------------- three.js scene ----------------
let scene, camera, renderer, hero, mapMesh = null;
const state = {
  mode: "world",            // "world" | "map"
  mapId: null, location: "World Map",
  x: 153, y: 165,           // start just outside Coneria
  stack: [],                // [{mode, mapId, x, y, location}]
  vehicle: null,            // null | "canoe" | "ship" | "airship"
  flying: false,
};
const mapCache = {};        // mapId -> {tex, lay, props}

function makeTexture(w, draw) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = w * TILE;
  draw(cv.getContext("2d"));
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  return tex;
}
function drawTiled(cx, w, getTile, sheet, colors) {
  for (let y = 0; y < w; y++) for (let x = 0; x < w; x++) {
    const t = getTile(x, y);
    if (sheet) cx.drawImage(sheet, (t%16)*TILE, (t>>4)*TILE, TILE, TILE,
                            x*TILE, y*TILE, TILE, TILE);
    else { cx.fillStyle = colors[t]; cx.fillRect(x*TILE, y*TILE, TILE, TILE); }
  }
}
function setMapMesh(tex, w) {
  if (mapMesh) { scene.remove(mapMesh); mapMesh.geometry.dispose(); }
  mapMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, w),
                           new THREE.MeshBasicMaterial({ map: tex }));
  mapMesh.position.set(w/2, -w/2, 0);
  scene.add(mapMesh);
}

// ---------------- NPCs ----------------
let npcMeshes = [];
function clearNpcs() {
  for (const n of npcMeshes) scene.remove(n.mesh);
  npcMeshes = [];
}
function spawnNpcs(c) {
  clearNpcs();
  for (const n of c.npcs || []) {
    const mat = c.npcMats[n.gfx] ||
      new THREE.MeshBasicMaterial({ color: 0xc0c0c0 });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.position.set(n.x + .5, -n.y - .5, 1);
    scene.add(mesh);
    npcMeshes.push({ mesh, npc: n });
  }
}
function npcAt(x, y) {
  for (const n of npcMeshes) if (n.npc.x === x && n.npc.y === y) return n.npc;
  return null;
}

// ---------------- vehicles (Phase D) ----------------
const vehicles = { ship: null, airship: null };   // parked {x, y, mesh}
const hasCanoe = true;                            // carried item in FF1; free here
let heroMat = null, vehMats = {};

function nearestTile(x0, y0, pred) {              // ring search, wraps like the map
  for (let r = 0; r < 128; r++)
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = (x0+dx+WORLD_W)%WORLD_W, y = (y0+dy+WORLD_W)%WORLD_W;
      if (pred(world.props[world.map[y*WORLD_W+x]] || {}, x, y)) return { x, y };
    }
  return null;
}
function shipSpotBeside(x, y) {                   // ocean tile next to a dock
  for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
    const nx = (x+dx+WORLD_W)%WORLD_W, ny = (y+dy+WORLD_W)%WORLD_W;
    if ((world.props[world.map[ny*WORLD_W+nx]] || {}).ship) return { x: nx, y: ny };
  }
  return null;
}
function placeVehicles() {
  // dock tiles are walkable shore, NOT ship-passable (verified in ROM data):
  // the ship parks on ocean beside a dock and you walk across to board.
  // not every dock tile touches ocean (Coneria's pier is 3 wide), so keep
  // searching until one does
  let spot = null;
  nearestTile(state.x, state.y, (p, x, y) => p.dock && (spot = shipSpotBeside(x, y)));
  vehicles.ship = spot;
  // authentic spot: the tile flagged special 3 = "airship" (its raising point)
  vehicles.airship = nearestTile(state.x, state.y, p => p.spec === 3)
                  || nearestTile(state.x, state.y, p => p.land && !p.impassable);
}
function syncVehicleMeshes() {
  for (const [k, v] of Object.entries(vehicles)) {
    if (!v) continue;
    if (!v.mesh) {
      v.mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
        vehMats[k] || new THREE.MeshBasicMaterial({ color: 0xd08030 }));
      scene.add(v.mesh);
    }
    v.mesh.material = vehMats[k] || v.mesh.material;
    v.mesh.visible = state.mode === "world" && state.vehicle !== k;
    v.mesh.position.set(v.x + .5, -v.y - .5, .9);
  }
}

function showWorld(x, y) {
  state.mode = "world"; state.mapId = null; state.location = "World Map";
  state.x = x; state.y = y;
  clearNpcs();
  const colors = ["#1840a0","#d8c878","#48a048","#186018","#806040"];
  setMapMesh(makeTexture(WORLD_W, cx =>
    drawTiled(cx, WORLD_W, (a,b) => world.map[b*WORLD_W+a],
              hasAssets ? worldSheet : null, colors)), WORLD_W);
}

function showMap(id, x, y, locName) {
  const enter = c => {
    state.mode = "map"; state.mapId = id; state.x = x; state.y = y;
    state.location = locName || state.location;
    setMapMesh(c.tex, MAP_W);
    spawnNpcs(c);
  };
  if (mapCache[id]) return enter(mapCache[id]);
  const m = FF1_ASSETS.maps[id];
  b64img(m.sheetPng, sheet => {
    const lay = b64bytes(m.layoutB64);
    const c = mapCache[id] = { lay, props: m.props, npcs: m.npcs || [],
      npcMats: {},
      tex: makeTexture(MAP_W, cx =>
        drawTiled(cx, MAP_W, (a,b) => lay[b*MAP_W+a], sheet)) };
    for (const [gfx, png] of Object.entries(m.npcSprites || {}))
      b64img(png, img => {
        const t = new THREE.Texture(img); t.needsUpdate = true;
        t.magFilter = THREE.NearestFilter;
        c.npcMats[gfx] = new THREE.MeshBasicMaterial({ map: t, transparent: true });
        if (state.mapId === id) spawnNpcs(c);   // refresh once textures land
      });
    enter(c);
  });
}

// ---------------- movement + stitching ----------------
const keys = {};
let stepTimer = 0, inBattle = false, gp = 0;
let msg = "", msgUntil = 0;
function say(s) { msg = s; msgUntil = performance.now() + 2200; }

// ---------------- party (Phase F) ----------------
const rnd = n => (Math.random() * n) | 0;              // 0..n-1
const rr = (a, b) => a + rnd(b - a + 1);               // a..b inclusive
const inv = { weapons: [], armors: [], potions: {}, spells: [] };
const pc = { name: "HERO", level: 1, exp: 0, hp: 30, maxHp: 30,
             str: 10, agi: 10, int: 10, vit: 10, luck: 10, hit: 7, mdef: 15,
             mp: [0,0,0,0,0,0,0,0], mpMax: [0,0,0,0,0,0,0,0],
             weapon: null, worn: [],                   // indices, worn max 4
             buffAtk: 0, buffDef: 0, buffEv: 0 };      // battle-scoped
function initPC() {
  const c = hasAssets && FF1_ASSETS.classes &&
            FF1_ASSETS.classes[FF1_ASSETS.heroClass];
  if (!c) return;
  Object.assign(pc, { name: c.name, hp: c.hp, maxHp: c.hp, str: c.str,
    agi: c.agi, int: c.int, vit: c.vit, luck: c.luck, hit: c.hit,
    mdef: c.mdef });
  pc.mpMax = [2, 0, 0, 0, 0, 0, 0, 0];   // FF1 casters start with 2 L1 charges
  pc.mp = [...pc.mpMax];
}
const wpn = () => pc.weapon != null ? FF1_ASSETS.weapons[pc.weapon] : null;
function atkPower() { return (pc.str >> 1) + (wpn() ? wpn().dmg : 1) + pc.buffAtk; }
function hitPct()   { return pc.hit + (wpn() ? wpn().hit : 0); }
function absorb()   { return pc.worn.reduce((s, a) =>
                        s + FF1_ASSETS.armors[a].def, 0) + pc.buffDef; }
function evadePc()  { return 48 + pc.agi + pc.buffEv
                        - pc.worn.reduce((s, a) => s + FF1_ASSETS.armors[a].weight, 0); }
function heal(n) { pc.hp = Math.min(pc.maxHp, pc.hp + n); return `Recovered ${n} HP!`; }
function restoreMp() { pc.mp = [...pc.mpMax]; }

// item id spaces: 28-67 weapons, 68-107 armor, 176-239 spells, rest potions/misc
function gainItem(id, name) {
  if (id >= 28 && id < 68) { inv.weapons.push(id - 28); return `${name} (weapon)`; }
  if (id >= 68 && id < 108) { inv.armors.push(id - 68); return `${name} (armor)`; }
  if (id >= 176 && id < 240) {
    const s = id - 176;
    if (!inv.spells.includes(s)) inv.spells.push(s);
    return `${name} (spell learned)`;
  }
  inv.potions[id] = (inv.potions[id] || 0) + 1;
  return name;
}
function gainExp(e) {
  pc.exp += e;
  const tbl = hasAssets && FF1_ASSETS.expTable;
  while (tbl && pc.level < 50 && pc.exp >= tbl[pc.level - 1]) levelUp();
}
function levelUp() {
  // real FF1 level-up: byte0 flags 0x20 HP bonus / 0x10 str / 0x08 agi /
  // 0x04 int / 0x02 vit / 0x01 luck (25% chance when unflagged);
  // byte1 bits = +1 spell charge for levels 1-8
  pc.level++;
  const c = FF1_ASSETS.classes[FF1_ASSETS.heroClass];
  const [st, mp] = c.levelUps[pc.level - 2] || [0, 0];
  pc.maxHp += 1 + (pc.vit >> 2) + (st & 0x20 ? rr(20, 25) : 0);
  [["str", 0x10], ["agi", 8], ["int", 4], ["vit", 2], ["luck", 1]]
    .forEach(([k, b]) => { if (st & b) pc[k]++; else if (!rnd(4)) pc[k]++; });
  pc.hit += c.hitLvl; pc.mdef += c.mdefLvl;
  for (let l = 0; l < 8; l++)
    if (mp & (1 << l)) pc.mpMax[l] = Math.min(9, pc.mpMax[l] + 1);
  pc.hp = pc.maxHp; pc.mp = [...pc.mpMax];
  say(`${pc.name} grows to level ${pc.level}!`);
}

const openedChests = new Set();
function openChest(x, y, idx) {
  const key = `${state.mapId}:${x},${y}`;
  if (openedChests.has(key)) return say("The box is empty.");
  openedChests.add(key);
  let name = (FF1_ASSETS.treasureNames || [])[idx] || "nothing";
  const g = /^(\d+)G$/.exec(name.replace(/\s/g, ""));
  if (g) gp += +g[1];
  else if (FF1_ASSETS.treasureItems)
    name = gainItem(FF1_ASSETS.treasureItems[idx], name);
  say(`In this box you found.. ${name}!`);
}

// ---------------- shops (Phase C) ----------------
let inShop = false;
function openShop(id) {
  const s = FF1_ASSETS.shops && FF1_ASSETS.shops[id];
  if (!s) return say("The door opens.");
  inShop = true;
  const el = document.getElementById("shop");
  const render = m => {
    let h = `<h3>${s.name}</h3>GP ${gp}<p>${m || "Welcome!"}</p>`;
    if (s.price != null)
      h += `<button id=s0>${s.kind === "INN" ? "Stay the night" : "Restore spirits"} — ${s.price} G</button>`;
    else
      s.items.forEach((it, i) => h += `<button id=s${i}>${it.name} — ${it.gp} G</button>`);
    el.innerHTML = h + `<button id=sx>EXIT</button>`;
    el.style.display = "block";
    el.querySelector("#sx").onclick = closeShop;
    if (s.price != null)
      el.querySelector("#s0").onclick = () => {
        if (gp < s.price) return render("Not enough GP!");
        gp -= s.price; pc.hp = pc.maxHp; restoreMp();
        render(s.kind === "INN" ? "Good night... HP and magic restored." : "Warriors, your spirits return!");
      };
    else
      s.items.forEach((it, i) => el.querySelector(`#s${i}`).onclick = () => {
        if (gp < it.gp) return render("Not enough GP!");
        gp -= it.gp;
        render(`${gainItem(it.id, it.name)}.. thank you!`);
      });
  };
  render();
}
function closeShop() { inShop = false; document.getElementById("shop").style.display = "none"; }

// ---------------- inventory / equipment (Phase F) ----------------
let inInv = false;
const POTION_FX = { "HEAL": () => heal(rr(16, 32)), "TENT": () => heal(30),
  "CABIN": () => heal(60), "HOUSE": () => { restoreMp(); return heal(120); } };
function openInv() {
  if (!hasAssets || !FF1_ASSETS.weapons) return say("(inventory needs assets)");
  inInv = true;
  const el = document.getElementById("inv"), A = FF1_ASSETS;
  const render = m => {
    let h = `<h3>${pc.name}  level ${pc.level}</h3>` +
      `<pre>HP ${pc.hp}/${pc.maxHp}   EXP ${pc.exp}   GP ${gp}\n` +
      `STR ${pc.str}  AGI ${pc.agi}  INT ${pc.int}  VIT ${pc.vit}  LUCK ${pc.luck}\n` +
      `ATK ${atkPower()}  HIT ${hitPct()}%  ABSORB ${absorb()}  EVADE ${evadePc()}\n` +
      `Spell charges L1-8: ${pc.mp.join(" ")}</pre><p>${m || "E = equipped; click to toggle"}</p>`;
    inv.weapons.forEach((w, i) => h +=
      `<button id=w${i}>${pc.weapon === w ? "E " : ""}${A.weapons[w].name} ` +
      `(dmg ${A.weapons[w].dmg} hit ${A.weapons[w].hit})</button>`);
    inv.armors.forEach((a, i) => h +=
      `<button id=a${i}>${pc.worn.includes(a) ? "E " : ""}${A.armors[a].name} ` +
      `(def ${A.armors[a].def} wt ${A.armors[a].weight})</button>`);
    Object.keys(inv.potions).forEach((id, i) => h +=
      `<button id=p${i}>${(A.itemNames || [])[id] || "item " + id} x${inv.potions[id]}</button>`);
    if (inv.spells.length)
      h += `<p>Spells: ${inv.spells.map(s => A.spells[s].name).join(", ")}</p>`;
    el.innerHTML = h + `<button id=ix>CLOSE</button>`;
    el.style.display = "block";
    el.querySelector("#ix").onclick = closeInv;
    inv.weapons.forEach((w, i) => el.querySelector(`#w${i}`).onclick = () => {
      pc.weapon = pc.weapon === w ? null : w; render();
    });
    inv.armors.forEach((a, i) => el.querySelector(`#a${i}`).onclick = () => {
      const k = pc.worn.indexOf(a);
      if (k >= 0) pc.worn.splice(k, 1);
      else if (pc.worn.length < 4) pc.worn.push(a);
      else return render("You can wear at most 4 pieces.");
      render();
    });
    Object.keys(inv.potions).forEach((id, i) =>
      el.querySelector(`#p${i}`).onclick = () => {
        const name = (A.itemNames || [])[id] || "";
        const fx = Object.keys(POTION_FX).find(k => name.includes(k));
        if (!fx) return render(`The ${name} does nothing here.`);
        if (--inv.potions[id] <= 0) delete inv.potions[id];
        render(POTION_FX[fx]());
      });
  };
  render();
}
function closeInv() { inInv = false; document.getElementById("inv").style.display = "none"; }

function showDialog(text) {
  const el = document.getElementById("dialog");
  el.textContent = text;
  el.style.display = "block";
}
function hideDialog() {
  document.getElementById("dialog").style.display = "none";
}
addEventListener("keydown", e => {
  keys[e.key] = true;
  if ((e.key === "i" || e.key === "I") && !inBattle && !inShop)
    inInv ? closeInv() : openInv();
  if (e.key === "Enter" && state.flying) {         // land the airship
    const p = tileProps(state.x, state.y);
    if (p.land && !p.impassable) {
      state.flying = false; state.vehicle = null;
      vehicles.airship = { ...vehicles.airship, x: state.x, y: state.y };
      say("The airship lands.");
    } else say("The airship can't land here.");
  }
});
addEventListener("keyup",   e => keys[e.key] = false);

function tileProps(x, y) {
  if (state.mode === "world") return world.props[world.map[y*WORLD_W+x]] || {};
  const c = mapCache[state.mapId];
  return c.props[c.lay[y*MAP_W+x] & 0x7F] || {};
}

function tryStep() {
  const d = keys.ArrowUp||keys.w ? [0,-1] : keys.ArrowDown||keys.s ? [0,1]
          : keys.ArrowLeft||keys.a ? [-1,0] : keys.ArrowRight||keys.d ? [1,0] : null;
  if (!d) return;
  let nx = state.x + d[0], ny = state.y + d[1];
  if (state.mode === "world") { nx = (nx+WORLD_W)%WORLD_W; ny = (ny+WORLD_W)%WORLD_W; }
  else { nx = (nx+MAP_W)%MAP_W; ny = (ny+MAP_W)%MAP_W; }  // interiors wrap (64x64 torus)
  hideDialog();
  const npc = state.mode === "map" && npcAt(nx, ny);
  if (npc) return showDialog(npc.dialog || "...");
  const p = tileProps(nx, ny);

  if (state.mode === "world") {
    const move = () => { state.x = nx; state.y = ny; };
    if (state.flying) return move();              // airship passes over everything
    // step onto a parked vehicle to board it (from foot or canoe)
    if (state.vehicle !== "ship" && vehicles.ship &&
        nx === vehicles.ship.x && ny === vehicles.ship.y) {
      state.vehicle = "ship"; say("You board the ship."); return move();
    }
    if (!state.vehicle && vehicles.airship &&
        nx === vehicles.airship.x && ny === vehicles.airship.y) {
      state.vehicle = "airship"; state.flying = true;
      say("The airship rises! (Enter to land)"); return move();
    }
    if (state.vehicle === "ship") {
      if (p.ship) {                               // sail; ocean has encounters
        move(); vehicles.ship.x = nx; vehicles.ship.y = ny;
        return maybeBattle(p, nx, ny);
      }
      if (p.dock && !p.impassable) {              // step ashore at a dock only
        state.vehicle = null; say("You step ashore."); return move();
      }
      return;
    }
    if (state.vehicle === "canoe") {
      if (p.canoe) { move(); return maybeBattle(p, nx, ny); }  // river battles
      if (p.impassable) return;
      state.vehicle = null; move();               // step ashore, keep walking
    } else if (p.impassable) {                    // on foot
      if (p.canoe && hasCanoe) {
        state.vehicle = "canoe"; say("You take the canoe."); return move();
      }
      return;
    } else move();
    // entrances trigger on foot only
    if (state.vehicle) return;
    if (p.entrance != null && world.entrances[p.entrance]) {
      const e = world.entrances[p.entrance];
      state.stack = [{ x: nx, y: ny }];          // world return point
      return showMap(e.map, e.x, e.y, e.name);
    }
    maybeBattle(p, nx, ny);
    return;
  }

  // ---- interior maps ----
  if (p.impassable) {
    // doors are flagged impassable in ROM data; the game's door routine
    // overrides that, so replicate the override here
    if (p.spec === 1) {
      if (p.arg) return openShop(p.arg);          // Phase C
      say("The door opens.");
    }
    else if (p.spec === 2) { say("The door is locked."); return; }
    else if (p.spec === 4) { openChest(nx, ny, p.arg); return; }
    else return;
  }
  state.x = nx; state.y = ny;
  if (p.ent === 1) {                            // to previous map / world
    const r = state.stack.pop();
    if (!r) return;
    if (r.mapId != null) return showMap(r.mapId, r.x, r.y, r.location);
    return showWorld(r.x, r.y);
  }
  if (p.ent === 2 && FF1_ASSETS.mapEntrances[p.arg]) {   // deeper teleport
    const t = FF1_ASSETS.mapEntrances[p.arg];
    state.stack.push({ mapId: state.mapId, x: state.x, y: state.y,
                       location: state.location });
    return showMap(t.map, t.x, t.y);
  }
  if (p.ent === 3 && FF1_ASSETS.mapExits[p.arg]) {       // exit to world
    const t = FF1_ASSETS.mapExits[p.arg];
    state.stack = [];
    return showWorld(t.x, t.y);
  }
  maybeBattle(p, nx, ny);
}

// ---------------- battle (Phase E) ----------------
let battle = null;
const imgCache = {};
function idxToURL(key, b64, w, pal, transparent0) {
  if (imgCache[key]) return imgCache[key];
  const px = b64bytes(b64), cv = document.createElement("canvas");
  cv.width = cv.height = w;
  const cx = cv.getContext("2d"), im = cx.createImageData(w, w);
  for (let i = 0; i < px.length; i++) {
    if (transparent0 && !px[i]) continue;
    const c = FF1_ASSETS.nesPal[pal[px[i]] & 63];
    im.data[i*4] = c[0]; im.data[i*4+1] = c[1]; im.data[i*4+2] = c[2];
    im.data[i*4+3] = 255;
  }
  cx.putImageData(im, 0, 0);
  return imgCache[key] = cv.toDataURL();
}
function monsterURL(bank, asn, palIdx) {
  const bk = FF1_ASSETS.monsterGfx[bank];
  return idxToURL(`m${bank}/${asn}/${palIdx}`, bk.images[asn], bk.sizes[asn],
                  FF1_ASSETS.monsterPals[palIdx], true);
}
function backdropURL(bank, bg) {
  return idxToURL(`b${bank}/${bg}`, FF1_ASSETS.monsterGfx[bank].pattern, 32,
                  FF1_ASSETS.battleBgPals[bg & 15], false);
}

// encounter groups: 0-63 world 32x32 domains, 64/65 river S/N, 66 ocean,
// interior map m -> group m+64; rate: battleProb[0] world, [m+1] interior
function worldGroupId(x, y, p) {
  if (p.bkind === 2) return 66;
  if (p.bkind === 1) return y < 128 ? 65 : 64;
  return ((y >> 5) << 3) | (x >> 5);
}
function maybeBattle(p, x, y) {
  if (!p.battle) return;
  const A = FF1_ASSETS, prob = A.battleProb;
  if (state.mode === "world") {
    if (rnd(256) < (prob ? prob[0] : 21))
      startBattle(worldGroupId(x, y, p), p.bg || 0);
  } else if (rnd(256) < (prob ? prob[state.mapId + 1] || 8 : 21))
    startBattle(state.mapId + 64, 14);          // cave-ish backdrop palette
}

function startBattle(groupId, bg) {
  if (!hasAssets || !FF1_ASSETS.formations) return legacyBattle();
  const g = FF1_ASSETS.battleGroups[groupId];
  if (!g) return;
  const odds = [12, 12, 12, 12, 6, 6, 3, 1];    // per schema slot weights /64
  let r = rnd(64), i = 0;
  while ((r -= odds[i]) >= 0) i++;
  const ref = g[i], f = FF1_ASSETS.formations[ref.f];
  if (f.size > 2) return;                       // fiend arenas: never in groups
  const mons = [];
  f.slots.forEach(sl => {
    const hi = ref.b ? sl.maxB : sl.max;
    if (!hi) return;
    const md = FF1_ASSETS.monsters[sl.id];
    for (let k = rr(Math.max(ref.b ? sl.minB : sl.min, 1), hi); k > 0; k--)
      mons.push({ ...md, maxHp: md.hp, alive: true, sleep: 0,
                  big: sl.asn & 1,              // odd assignments are 48x48
                  img: monsterURL(f.bank, sl.asn, f.pals[sl.pal]) });
  });
  if (!mons.length) return;
  pc.buffAtk = pc.buffDef = pc.buffEv = 0;
  battle = { mons, noRun: f.noRun, bank: f.bank, bg, target: 0,
             log: ["Monsters approach!"], over: false };
  inBattle = true;
  renderBattle();
}

function renderBattle() {
  const el = document.getElementById("battle"), A = FF1_ASSETS;
  const alive = battle.mons.filter(m => m.alive);
  if (!battle.mons[battle.target] || !battle.mons[battle.target].alive)
    battle.target = battle.mons.indexOf(alive[0]);
  const t = battle.mons[battle.target];
  let h = `<div style="background:url(${backdropURL(battle.bank, battle.bg)});` +
    `background-size:64px;height:32px;image-rendering:pixelated"></div>` +
    `<img src="data:image/png;base64,${A.heroBattlePng}" ` +
    `style="float:right;width:48px;image-rendering:pixelated">` +
    `<div>` + battle.mons.map((m, i) => m.alive ?
      `<img data-i=${i} src="${m.img}" style="width:${m.big ? 96 : 64}px;` +
      `image-rendering:pixelated;cursor:pointer;` +
      `${i === battle.target ? "outline:2px solid #ff0" : ""}">` : ``).join("") +
    `</div>` +
    `<p>${t ? `> ${t.name}  HP ${Math.max(t.hp, 0)}` : ""}` +
    `   |   ${pc.name} HP ${pc.hp}/${pc.maxHp}</p>` +
    `<p>${battle.log.slice(-3).join("<br>")}</p>`;
  h += battle.over ? `<button id=bx>OK</button>` :
    `<button id=bf>FIGHT</button><button id=bm>MAGIC</button>` +
    `<button id=br>RUN</button><span id=bs></span>`;
  el.innerHTML = h; el.style.display = "block";
  el.querySelectorAll("img[data-i]").forEach(im =>
    im.onclick = () => { battle.target = +im.dataset.i; renderBattle(); });
  if (battle.over) { el.querySelector("#bx").onclick = endBattle; return; }
  el.querySelector("#bf").onclick = () => playerTurn({ fight: true });
  el.querySelector("#br").onclick = () => playerTurn({ run: true });
  el.querySelector("#bm").onclick = () => {
    const bs = el.querySelector("#bs");
    bs.innerHTML = inv.spells.map(s =>
      `<button data-s=${s}>${A.spells[s].name} (${pc.mp[s >> 3]})</button>`)
      .join("") || " no spells known";
    bs.querySelectorAll("button[data-s]").forEach(b =>
      b.onclick = () => playerTurn({ spell: +b.dataset.s }));
  };
}

// FF1 to-hit: chance = 168 + hit% - evade (0..200), crit adds an unabsorbed roll
function physRoll(atk, hit, crit, evade, def) {
  const chance = Math.max(0, Math.min(200, 168 + hit - evade));
  if (rnd(201) > chance) return 0;
  let d = Math.max(1, rr(atk, atk * 2) - def);
  if (rnd(201) <= crit) d += rr(atk, atk * 2);
  return d;
}

function playerTurn(act) {
  const A = FF1_ASSETS, L = s => battle.log.push(s);
  if (act.run) {
    if (battle.noRun) L("There's no escape!");
    else if (rnd(100) < 40 + pc.luck) {
      L("You fled!"); battle.over = true; battle.fled = true;
      return renderBattle();
    } else L("Couldn't escape!");
  } else if (act.fight) {
    const t = battle.mons[battle.target], w = wpn();
    let atk = atkPower(), hit = hitPct();
    // elemental / category weakness: +4 attack, +40 hit% (FF1 rule)
    if (w && (w.elem & t.weak)) { atk += 4; hit += 40; }
    if (w && (w.cat & t.category)) { atk += 4; hit += 40; }
    const swings = 1 + (hitPct() >> 5);         // FF1 multi-hit from hit%
    let dmg = 0, landed = 0;
    for (let i = 0; i < swings; i++) {
      const d = physRoll(atk, hit, w ? w.crit : 5, t.evade, t.defense);
      if (d) { dmg += d; landed++; }
    }
    if (dmg) { t.hp -= dmg; L(`You hit ${t.name} x${landed} — ${dmg} damage!`); }
    else L(`You miss ${t.name}!`);
    if (t.hp <= 0) { t.alive = false; L(`${t.name} is defeated!`); }
  } else if (act.spell != null) {
    const s = act.spell, sp = A.spells[s];
    if (pc.mp[s >> 3] <= 0) { battle.log.push("No charges left!"); return renderBattle(); }
    pc.mp[s >> 3]--;
    castSpell(sp, L);
  }
  if (!battle.over)                             // monsters strike back
    for (const m of battle.mons) {
      if (!m.alive) continue;
      if (m.sleep > 0) { m.sleep--; battle.log.push(`${m.name} is out cold.`); continue; }
      let dmg = 0;
      for (let i = 0; i < Math.max(1, m.hits); i++)
        dmg += physRoll(m.attack, m.hitRate, m.crit, evadePc(), absorb());
      if (dmg) { pc.hp -= dmg; battle.log.push(`${m.name} hits you — ${dmg} damage!`); }
      else battle.log.push(`${m.name} misses.`);
      if (pc.hp <= 0) break;
    }
  checkBattleEnd();
  renderBattle();
}

function castSpell(sp, L) {
  // spell accuracy: 148 + acc - magic defense; a resisted roll halves damage
  const acc = t => rnd(201) <= Math.max(0, 148 + sp.acc - t.magDef);
  const targets = (sp.tgt & 1) ? battle.mons.filter(m => m.alive)
                               : [battle.mons[battle.target]];
  switch (sp.fx) {
    case 1: case 2:                             // damage / damage undead
      for (const t of targets) {
        if (sp.fx === 2 && !(t.category & 8)) {
          L(`${sp.name} has no effect on ${t.name}.`); continue;
        }
        let d = rr(sp.pwr, sp.pwr * 2);
        if (sp.elem & t.weak) d = (d * 3) >> 1;
        if (sp.elem & t.resist) d >>= 1;
        if (!acc(t)) d >>= 1;
        t.hp -= d; L(`${sp.name} hits ${t.name} — ${d} damage!`);
        if (t.hp <= 0) { t.alive = false; L(`${t.name} is defeated!`); }
      }
      break;
    case 6: case 7: L(`${sp.name}: ` + heal(rr(sp.pwr, sp.pwr * 2))); break;
    case 15: pc.hp = pc.maxHp; L(`${sp.name}: HP fully restored!`); break;
    case 9:  pc.buffDef += sp.pwr; L(`${sp.name}: defense rises!`); break;
    case 16: pc.buffEv += sp.pwr; L(`${sp.name}: harder to hit!`); break;
    case 11: case 13: pc.buffAtk += sp.pwr; L(`${sp.name}: attack rises!`); break;
    case 3: case 18:                            // status: simplified to a nap
      for (const t of targets)
        if (acc(t)) { t.sleep = rr(2, 4); L(`${t.name} is incapacitated!`); }
        else L(`${t.name} resists!`);
      break;
    default: L(`${sp.name}... nothing happens. (effect ${sp.fx} not in demo)`);
  }
}

function checkBattleEnd() {
  if (battle.over) return;
  if (pc.hp <= 0) {
    battle.log.push("You have fallen...");
    battle.over = battle.lost = true;
  } else if (!battle.mons.some(m => m.alive)) {
    const e = battle.mons.reduce((s, m) => s + m.exp, 0);
    const g = battle.mons.reduce((s, m) => s + m.gp, 0);
    battle.log.push(`Victory! ${e} EXP, ${g} GP.`);
    gp += g; gainExp(e);
    battle.over = true;
  }
}

function endBattle() {
  document.getElementById("battle").style.display = "none";
  inBattle = false;
  if (battle && battle.lost) {                  // demo mercy rule
    pc.hp = pc.maxHp; pc.mp = [...pc.mpMax]; gp >>= 1;
    state.stack = []; state.vehicle = null; state.flying = false;
    showWorld(153, 165);
    say("You awaken outside Coneria... half your GP is gone.");
  }
  battle = null;
}

function legacyBattle() {                       // placeholder-mode fallback
  inBattle = true;
  const m = { ...monsters[(Math.random() * monsters.length) | 0] };
  const el = document.getElementById("battle");
  const render = msg => {
    el.innerHTML = `<h3>${m.name}</h3>HP ${m.hp} &nbsp; ATK ${m.attack}` +
      `<p>${msg || "Monsters approach!"}</p>` +
      `<button id=bf>FIGHT</button><button id=br>RUN</button>`;
    el.style.display = "block";
    el.querySelector("#bf").onclick = () => {
      m.hp -= 5 + rnd(6);
      if (m.hp <= 0) { gp += m.gp; gainExp(m.exp); return endBattle(); }
      pc.hp -= Math.max(1, m.attack - rnd(3));
      if (pc.hp <= 0) { pc.hp = pc.maxHp; return endBattle(); }
      render("You strike! It strikes back!");
    };
    el.querySelector("#br").onclick = endBattle;
  };
  render();
}

// ---------------- boot + loop ----------------
function start() {
  scene = new THREE.Scene();
  renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const view = 18, aspect = innerWidth / innerHeight;
  camera = new THREE.OrthographicCamera(-view*aspect/2, view*aspect/2,
                                        view/2, -view/2, .1, 10);
  camera.position.z = 5;
  if (hasAssets && heroImg) {
    const t = new THREE.Texture(heroImg); t.needsUpdate = true;
    t.magFilter = THREE.NearestFilter;
    heroMat = new THREE.MeshBasicMaterial({ map: t, transparent: true });
  } else heroMat = new THREE.MeshBasicMaterial({ color: 0xf8f8f8 });
  hero = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), heroMat);
  hero.position.z = 1;
  scene.add(hero);
  // vehicle materials: flat-color fallbacks, swapped for ROM sprites as they load
  vehMats = { ship: new THREE.MeshBasicMaterial({ color: 0xd08030 }),
              airship: new THREE.MeshBasicMaterial({ color: 0xc0c0e0 }),
              canoe: new THREE.MeshBasicMaterial({ color: 0xe0a040 }) };
  if (hasAssets && FF1_ASSETS.vehiclePngs)
    for (const [k, png] of Object.entries(FF1_ASSETS.vehiclePngs))
      b64img(png, img => {
        const t = new THREE.Texture(img); t.needsUpdate = true;
        t.magFilter = THREE.NearestFilter;
        vehMats[k] = new THREE.MeshBasicMaterial({ map: t, transparent: true });
      });
  initPC();
  showWorld(state.x, state.y);
  placeVehicles();
  animate(0);
}

function animate(t) {
  requestAnimationFrame(animate);
  const step = state.flying ? 60 : 140;           // airship is fast, like FF1
  if (!inBattle && !inShop && !inInv && t - stepTimer > step) {
    tryStep(); stepTimer = t;
  }
  hero.material = (state.vehicle && vehMats[state.vehicle]) || heroMat;
  hero.position.set(state.x + .5, -state.y - .5, 1);
  syncVehicleMeshes();
  camera.position.x = state.x + .5; camera.position.y = -state.y - .5;
  document.getElementById("hud").textContent =
    `${state.location} ${hasAssets ? "" : "(placeholder — run extractor)"}\n` +
    `${pc.name} L${pc.level}  HP ${pc.hp}/${pc.maxHp}  GP ${gp}  EXP ${pc.exp}\n` +
    `WASD/arrows move, I gear` +
    (state.vehicle ? `  [${state.vehicle}${state.flying ? " — Enter to land" : ""}]`
                   : hasCanoe ? `  (canoe: rivers ok)` : ``) +
    (msgUntil > t ? `\n${msg}` : ``);
  renderer.render(scene, camera);
}

if (hasAssets) {
  let pending = 2;
  b64img(FF1_ASSETS.heroPng, i => { heroImg = i; if (!--pending) start(); });
  b64img(FF1_ASSETS.tilesheetPng, i => { worldSheet = i; if (!--pending) start(); });
} else start();
</script>
